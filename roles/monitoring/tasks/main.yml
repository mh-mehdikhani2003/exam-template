---
# Install Monitoring (Prometheus + Node Exporter + Grafana).
# Prometheus listens on :9090, Node Exporter on :9100, Grafana on :3000.
# Prometheus is added as a Grafana datasource, and one dashboard with CPU & memory is provisioned.

- name: Install required packages
  ansible.builtin.apt:
    name:
      - wget
      - curl
      - tar
      - gnupg
      - adduser
      - apt-transport-https
      - software-properties-common
    update_cache: true

# ============ NODE EXPORTER ============
- name: Create node_exporter system user
  ansible.builtin.user:
    name: nodeexp
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter.tar.gz"
    mode: "0644"
    timeout: 120

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/node_exporter-1.7.0.linux-amd64/node_exporter"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-1.7.0.linux-amd64/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: restart node_exporter

- name: Create systemd unit for node_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Node Exporter
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=nodeexp
      Group=nodeexp
      Type=simple
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=0.0.0.0:9100
      [Install]
      WantedBy=multi-user.target
  notify: restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    daemon_reload: true
    enabled: true
    state: started

# ============ PROMETHEUS ============
- name: Create prometheus user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download prometheus
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v2.48.0/prometheus-2.48.0.linux-amd64.tar.gz"
    dest: "/tmp/prometheus.tar.gz"
    mode: "0644"
    timeout: 120

- name: Extract prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/prometheus-2.48.0.linux-amd64/prometheus"

- name: Install prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-2.48.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool

- name: Install prometheus consoles
  ansible.builtin.copy:
    src: "/tmp/prometheus-2.48.0.linux-amd64/{{ item }}"
    dest: "/etc/prometheus/"
    remote_src: true
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - consoles
    - console_libraries

- name: Deploy prometheus config (scrape itself + node_exporter)
  ansible.builtin.copy:
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'node_exporter'
          static_configs:
            - targets: ['localhost:9100']
  notify: restart prometheus

- name: Create systemd unit for prometheus (listens on 0.0.0.0:9090)
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target
      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --web.console.templates=/etc/prometheus/consoles --web.console.libraries=/etc/prometheus/console_libraries --web.listen-address=0.0.0.0:9090
      ExecReload=/bin/kill -HUP $MAINPID
      [Install]
      WantedBy=multi-user.target
  notify: restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    daemon_reload: true
    enabled: true
    state: started

# ============ GRAFANA ============
- name: Add Grafana GPG key
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    keyring: /etc/apt/trusted.gpg.d/grafana.gpg
    state: present

- name: Add Grafana APT repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/trusted.gpg.d/grafana.gpg] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    update_cache: true

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Provision Prometheus as a Grafana datasource
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: "0644"
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://localhost:9090
          isDefault: true
          editable: true
  notify: restart grafana

- name: Configure Grafana dashboard provider
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: grafana
    group: grafana
    mode: "0644"
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
  notify: restart grafana

- name: Provision CPU & Memory dashboard
  ansible.builtin.copy:
    dest: /var/lib/grafana/dashboards/cpu-memory.json
    owner: grafana
    group: grafana
    mode: "0644"
    content: |
      {% raw %}
      {
        "annotations": {"list": []},
        "title": "CPU and Memory",
        "uid": "cpu-memory",
        "version": 1,
        "schemaVersion": 27,
        "timezone": "browser",
        "panels": [
          {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "title": "CPU Usage (%)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{job=\"node_exporter\",mode=\"idle\"}[5m])) * 100)",
                "legendFormat": "{{instance}}",
                "refId": "A"
              }
            ]
          },
          {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "title": "Memory Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
                "legendFormat": "Used",
                "refId": "A"
              },
              {
                "expr": "node_memory_MemTotal_bytes",
                "legendFormat": "Total",
                "refId": "B"
              }
            ]
          }
        ],
        "time": {"from": "now-1h", "to": "now"}
      }
      {% endraw %}
  notify: restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: http://localhost:3000/api/health
    return_content: true
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 2
